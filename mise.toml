[tasks.ci]
run = [
  "cargo clippy",
  "cargo test",
  "cargo run --example run",
]

[tools]
"cargo:cargo-msrv" = "latest"
# hk.pkl amends a pinned hk package; the tools themselves float and are resolved by mise.lock.
hk = { version = "latest", minimum_release_age = "0s" }
jactionlint = "2.1.0"
pkl = "latest"
